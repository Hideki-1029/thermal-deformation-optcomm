# PAT粗捕捉シミュレーション設定
# 単位がある値は、キー名の末尾に単位を書いている。

input:
  input_glob: results/femap_deformation/*/los_angles.csv
  # Ideal / baseline (no lightweight prediction): no_correction, thermal_truth_*
  truth_output_dir: results/pat_acquisition/femap_los_truth
  # Fourier / static-bias lightweight model PAT evaluation
  fourier_output_dir: results/pat_acquisition/fourier_los_model
  # Hierarchical sunface ΔT (bcase) PAT evaluation
  bcase_output_dir: results/pat_acquisition/sunface_deltaT_bcase_los_model/pat
  los_prefix: far_field_los

scan:
  max_range_urad: 1600.0
  step_urad: 40.0
  detect_radius_urad: 25.0
  dwell_time_s: 0.1

orbit_error:
  # synthetic: legacy fixed Gaussian placeholder
  # sentinel1_tle_vs_pod: TLE-only forward propagation vs Sentinel-1 POEORB
  source: sentinel1_tle_vs_pod
  timeseries_csv: results/orbit/sentinel1_tle_vs_pod/orbit_prediction_error_timeseries.csv
  # Map Femap simulation time_s onto the orbit-error window cyclically.
  resample_mode: cyclic

nonthermal_error:
  seed: 42
  # Used only when orbit_error.source = synthetic
  orbit_prediction_bias_1sigma_urad: 150.0
  attitude_random_1sigma_urad: 50.0
  alignment_bias_1sigma_urad: 50.0
  drift_amplitude_urad: 30.0
  drift_period_s: 900.0

lightweight_model:
  # 1.0 = train on the first orbit only, then predict for all opportunities.
  train_fraction: 1.0
  fourier_order: 4
  include_drift: false
  ridge_lam: 0.001
  # Prefer orbit_period_s from Excel (case_metadata). Keep true only for ad-hoc debugging.
  auto_orbit_period: false
  orbit_period_s: 6050.0

case_metadata:
  case_matrix_xlsx: cases/case_matrix.xlsx
  case_matrix_sheet: case_matrix
  orbit_catalog_xlsx: cases/orbit_catalog.xlsx
  orbit_catalog_sheet: orbit_catalog
